<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFF"/><stop offset="1" stop-color="#EAF2FF"/></linearGradient>
  <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8FBFFF"/><stop offset="1" stop-color="#5AA2FF"/></linearGradient>
  <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F7BEF"/><stop offset="1" stop-color="#0A6CFF"/></linearGradient>
  <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0A6CFF"><animate attributeName="stop-color" values="#0A6CFF;#3D9BFF;#0A6CFF" dur="5s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#3D9BFF"><animate attributeName="stop-color" values="#3D9BFF;#0A6CFF;#3D9BFF" dur="5s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <clipPath id="mq"><rect x="280" y="128" width="640" height="26"/></clipPath>
</defs>
<rect width="1200" height="240" fill="url(#bg)"/>

<!-- soft blobs -->
<circle cx="80" cy="30" r="110" fill="#D9E8FF" opacity="0.8"><animate attributeName="r" values="110;124;110" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="1140" cy="20" r="130" fill="#CFE2FF" opacity="0.7"><animate attributeName="r" values="130;116;130" dur="9s" repeatCount="indefinite"/></circle>

<!-- dot grid -->
<circle cx="60" cy="170" r="3" fill="#0A6CFF"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle cx="82" cy="170" r="3" fill="#0A6CFF"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></circle>
<circle cx="104" cy="170" r="3" fill="#0A6CFF"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
<circle cx="126" cy="170" r="3" fill="#0A6CFF"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
<circle cx="60" cy="192" r="3" fill="#0A6CFF"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
<circle cx="82" cy="192" r="3" fill="#0A6CFF"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></circle>
<circle cx="104" cy="192" r="3" fill="#0A6CFF"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
<circle cx="126" cy="192" r="3" fill="#0A6CFF"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></circle>

<!-- particles -->
<g fill="#0A6CFF">
  <circle cx="230" cy="200" r="2.5"><animate attributeName="cy" values="210;20" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="200" r="2"><animate attributeName="cy" values="210;20" dur="13s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="13s" begin="2s" repeatCount="indefinite"/></circle>
  <circle cx="880" cy="200" r="3"><animate attributeName="cy" values="210;20" dur="11s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="11s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="1010" cy="200" r="2"><animate attributeName="cy" values="210;20" dur="12s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="3s" repeatCount="indefinite"/></circle>
</g>

<!-- text -->
<rect x="564" y="30" width="72" height="3.5" rx="2" fill="#0A6CFF"><animate attributeName="width" values="0;72;0" dur="4s" repeatCount="indefinite"/><animate attributeName="x" values="600;564;600" dur="4s" repeatCount="indefinite"/></rect>
<text x="600" y="84" text-anchor="middle" font-family="'Segoe UI','Montserrat',Arial,sans-serif" font-size="42" font-weight="800" fill="#0B1B3A" letter-spacing="-1">Thanks for <tspan fill="url(#nm)">visiting!</tspan>
  <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/></text>
<text x="600" y="116" text-anchor="middle" font-family="'Segoe UI','Montserrat',Arial,sans-serif" font-size="17" fill="#3A4766">Let's build intelligent AI agents &amp; real-world automation together.</text>

<!-- marquee -->
<g clip-path="url(#mq)"><g>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-680 0" dur="18s" repeatCount="indefinite"/>
  <text x="280" y="147" font-family="'Segoe UI','Montserrat',Arial,sans-serif" font-size="15" font-weight="600" fill="#0A6CFF" textLength="680" lengthAdjust="spacing">Python  •  FastAPI  •  LangChain  •  LangGraph  •  MCP  •  n8n  •  </text>
  <text x="960" y="147" font-family="'Segoe UI','Montserrat',Arial,sans-serif" font-size="15" font-weight="600" fill="#0A6CFF" textLength="680" lengthAdjust="spacing">Python  •  FastAPI  •  LangChain  •  LangGraph  •  MCP  •  n8n  •  </text>
  <text x="1640" y="147" font-family="'Segoe UI','Montserrat',Arial,sans-serif" font-size="15" font-weight="600" fill="#0A6CFF" textLength="680" lengthAdjust="spacing">Python  •  FastAPI  •  LangChain  •  LangGraph  •  MCP  •  n8n  •  </text>
</g></g>

<!-- waves -->
<path d="M0 196 Q150 170 300 196 T600 196 T900 196 T1200 196 T1500 196 T1800 196 T2100 196 T2400 196 V260 H0 Z" fill="url(#w1)" opacity="0.55"><animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="13s" repeatCount="indefinite"/></path>
<path d="M0 212 Q150 236 300 212 T600 212 T900 212 T1200 212 T1500 212 T1800 212 T2100 212 T2400 212 V260 H0 Z" fill="url(#w1)" opacity="0.7"><animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="9s" repeatCount="indefinite"/></path>
<path d="M0 224 Q150 206 300 224 T600 224 T900 224 T1200 224 T1500 224 T1800 224 T2100 224 T2400 224 V260 H0 Z" fill="url(#w2)" opacity="1"><animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="7s" repeatCount="indefinite"/></path>
</svg>